<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PIJAR</title>
  <script src="js/auth.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;}
    .pijar-main{margin-left:224px;min-height:100vh;}
    .topbar{background:#fff;padding:11px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .topbar h2{font-size:.95rem;font-weight:700;color:#0f172a;}
    .topbar-meta{font-size:.78rem;color:#94a3b8;}
    .content{padding:20px 24px;}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
    .stat-card{background:#fff;border-radius:12px;padding:16px 18px;border-top:3px solid #1a56db;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .stat-card.merah{border-top-color:#dc2626;}
    .stat-card.kuning{border-top-color:#d97706;}
    .stat-card.hijau{border-top-color:#059669;}
    .stat-label{font-size:.68rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
    .stat-value{font-size:2rem;font-weight:900;margin:4px 0 2px;color:#1a56db;line-height:1;}
    .stat-card.merah .stat-value{color:#dc2626;}
    .stat-card.kuning .stat-value{color:#d97706;}
    .stat-card.hijau .stat-value{color:#059669;}
    .stat-sub{font-size:.72rem;color:#94a3b8;}
    .map-section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px;}
    .section-title{font-size:.88rem;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#0f172a;}
    .legend{display:flex;gap:14px;flex-wrap:wrap;}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:.74rem;color:#64748b;}
    .legend-dot{width:9px;height:9px;border-radius:50%;}
    #peta{height:400px;border-radius:8px;}
    .table-section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    table{width:100%;border-collapse:collapse;font-size:.875rem;}
    thead th{background:#f8fafc;padding:9px 12px;text-align:left;font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;border-bottom:1px solid #e2e8f0;}
    tbody td{padding:9px 12px;border-bottom:1px solid #f1f5f9;}
    tbody tr:hover{background:#f8fafc;}
    .badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:600;}
    .badge-merah{background:#fee2e2;color:#991b1b;}
    .badge-kuning{background:#fef3c7;color:#92400e;}
    .badge-biru{background:#dbeafe;color:#1e40af;}
    .btn{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:.78rem;font-weight:600;}
    .btn-primary{background:#1a56db;color:#fff;}
    .btn-primary:hover{background:#1648c2;}
    .loading{color:#94a3b8;font-size:.85rem;padding:20px;text-align:center;}
    @media(max-width:768px){.stat-grid{grid-template-columns:repeat(2,1fr);}.content{padding:12px;}}
  </style>
</head>
<body>
<script src="js/sidebar.js?v=20260826" data-page="dashboard"></script>
<div class="pijar-main">
  <div class="topbar">
    <h2>Dashboard Aset PJU</h2>
    <span class="topbar-meta" id="waktu-sekarang"></span>
  </div>
  <div class="content">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total Aset</div><div class="stat-value" id="stat-total">…</div><div class="stat-sub">titik lampu terdaftar</div></div>
      <div class="stat-card merah"><div class="stat-label">Rusak</div><div class="stat-value" id="stat-rusak">…</div><div class="stat-sub">perlu penanganan</div></div>
      <div class="stat-card kuning"><div class="stat-label">Dalam Pengerjaan</div><div class="stat-value" id="stat-pengerjaan">…</div><div class="stat-sub">sedang diperbaiki</div></div>
      <div class="stat-card hijau"><div class="stat-label">Menyala</div><div class="stat-value" id="stat-menyala">…</div><div class="stat-sub">beroperasi normal</div></div>
    </div>
    <div class="map-section">
      <div class="section-title">
        <span>🗺️ Peta Sebaran Aset PJU — Kota Yogyakarta</span>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#059669"></div>Menyala</div>
          <div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div>Rusak</div>
          <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>Dalam Pengerjaan</div>
        </div>
      </div>
      <div id="peta"></div>
    </div>
    <div class="table-section">
      <div class="section-title">
        <span>⚠️ Aset Memerlukan Perhatian</span>
        <a href="laporan.html"><button class="btn btn-primary">Lihat Semua Laporan</button></a>
      </div>
      <table>
        <thead><tr><th>Kode Aset</th><th>Alamat</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody id="tabel-aset-rusak"><tr><td colspan="5" class="loading">🔄 Memuat data...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API='https://api.pjujogja.id';
function updateWaktu(){const el=document.getElementById('waktu-sekarang');const now=new Date();el.textContent=now.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' • '+now.toLocaleTimeString('id-ID');}
setInterval(updateWaktu,1000);updateWaktu();
const peta=L.map('peta').setView([-7.8,110.366],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(peta);
const warna={'Menyala':'#059669','Rusak':'#dc2626','Dalam Pengerjaan':'#d97706'};
function markerIcon(s){const c=warna[s]||'#64748b';return L.divIcon({className:'',html:`<div style="width:11px;height:11px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,iconSize:[11,11],iconAnchor:[5,5]});}
async function loadAset(){
  try{
    const res=await fetch(`${API}/api/aset`);
    const json=await res.json();const data=json.data||[];
    document.getElementById('stat-total').textContent=data.length;
    document.getElementById('stat-rusak').textContent=data.filter(a=>a.status==='Rusak').length;
    document.getElementById('stat-pengerjaan').textContent=data.filter(a=>a.status==='Dalam Pengerjaan').length;
    document.getElementById('stat-menyala').textContent=data.filter(a=>a.status==='Menyala').length;
    data.forEach(a=>{if(a.lat&&a.lng){L.marker([a.lat,a.lng],{icon:markerIcon(a.status)}).addTo(peta).bindPopup(`<strong>${a.kode_aset}</strong><br>${a.alamat}<br><span style="color:${warna[a.status]||'#333'};font-weight:600">${a.status}</span>`);}});
    const perlu=data.filter(a=>a.status!=='Menyala');
    const tbody=document.getElementById('tabel-aset-rusak');
    tbody.innerHTML=perlu.length?perlu.map(a=>`<tr><td><code style="font-size:.78rem">${a.kode_aset}</code></td><td>${a.alamat}</td><td><span class="badge badge-biru">${a.kategori_jalan||'-'}</span></td><td><span class="badge ${a.status==='Rusak'?'badge-merah':'badge-kuning'}">${a.status}</span></td><td><a href="laporan.html?aset=${a.id_aset}"><button class="btn btn-primary">Laporan</button></a></td></tr>`).join(''):'<tr><td colspan="5" class="loading">✅ Semua aset dalam kondisi baik</td></tr>';
  }catch(e){document.getElementById('tabel-aset-rusak').innerHTML='<tr><td colspan="5" class="loading">Gagal memuat data.</td></tr>';}
}
loadAset();
</script>
</body></html>
