<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PIJAR</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:#1e3a5f;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:#fff;border-radius:16px;padding:40px 36px;width:380px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,0.25);}
    .logo{text-align:center;margin-bottom:28px;}
    .logo h1{font-size:2rem;font-weight:800;color:#1e3a5f;}
    .logo span{color:#facc15;}
    .logo p{font-size:0.82rem;color:#6b7280;margin-top:4px;}
    .form-group{margin-bottom:16px;}
    label{display:block;font-size:0.82rem;font-weight:600;color:#374151;margin-bottom:6px;}
    input{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:0.95rem;font-family:inherit;transition:border 0.2s;}
    input:focus{outline:none;border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,0.12);}
    .btn-login{width:100%;padding:11px;background:#1a56db;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;transition:background 0.2s;}
    .btn-login:hover{background:#1648c2;}
    .btn-login:disabled{background:#93c5fd;cursor:not-allowed;}
    .alert{padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:14px;display:none;}
    .alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
    .alert-info{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;}
    .footer-text{text-align:center;font-size:0.75rem;color:#9ca3af;margin-top:20px;}
    .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>⚡ PI<span>JAR</span></h1>
    <p>Sistem Manajemen Aset PJU<br>UPT PJU Kota Yogyakarta</p>
  </div>
  <div class="alert alert-error" id="alert-error"></div>
  <div class="alert alert-info" id="alert-info"></div>
  <form id="form-login" onsubmit="doLogin(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btn-submit">
      <span id="btn-text">Masuk</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>
  <p class="footer-text">Perwal Kota Yogyakarta No. 50/2022</p>
</div>
<script>
const API = 'https://api.pjujogja.id';

// Kalau sudah login, langsung ke dashboard
if (localStorage.getItem('pijar_token')) {
  try {
    const p = JSON.parse(atob(localStorage.getItem('pijar_token').split('.')[1]));
    if (p.exp * 1000 > Date.now()) window.location.href = 'index.html';
    else localStorage.removeItem('pijar_token');
  } catch(e) { localStorage.removeItem('pijar_token'); }
}

// Fetch dengan auto-retry 1x (untuk mengatasi cold start shared hosting)
async function fetchWithRetry(url, options, retries = 1, delayMs = 1500) {
  try {
    const res = await fetch(url, options);
    return res;
  } catch (err) {
    if (retries > 0) {
      const infoEl = document.getElementById('alert-info');
      infoEl.textContent = '⏳ Server sedang memuat, mencoba kembali...';
      infoEl.style.display = 'block';
      await new Promise(r => setTimeout(r, delayMs));
      infoEl.style.display = 'none';
      return fetchWithRetry(url, options, retries - 1, delayMs);
    }
    throw err;
  }
}

async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const alertEl = document.getElementById('alert-error');
  const btn = document.getElementById('btn-submit');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('spinner');

  alertEl.style.display = 'none';
  btn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';

  try {
    const res = await fetchWithRetry(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const json = await res.json();
    if (json.success) {
      localStorage.setItem('pijar_token', json.token);
      localStorage.setItem('pijar_user', JSON.stringify(json.pengguna));
      window.location.href = 'index.html';
    } else {
      alertEl.textContent = json.error || 'Login gagal. Periksa username dan password.';
      alertEl.style.display = 'block';
    }
  } catch(err) {
    alertEl.textContent = 'Tidak dapat terhubung ke server. Periksa koneksi internet Anda.';
    alertEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
}
</script>
</body></html>
