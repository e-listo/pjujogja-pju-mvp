<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — PIJAR</title>
  <meta name="theme-color" content="#0f2236">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter','Segoe UI',system-ui,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0f2236;
      background-image:
        radial-gradient(ellipse 70% 50% at 50% 0%,rgba(249,115,22,.15) 0%,transparent 65%),
        repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.02) 40px),
        repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.02) 40px);
    }
    .login-wrap{
      width:360px;max-width:94vw;
      animation:fadeUp .4s ease both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

    /* CARD */
    .card{
      background:#1a2f48;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:36px 32px 28px;
      box-shadow:0 24px 64px rgba(0,0,0,.5);
    }

    /* LOGO AREA */
    .logo-area{
      text-align:center;
      margin-bottom:28px;
    }
    .logo-img-wrap{
      width:88px;height:88px;margin:0 auto 16px;
      display:flex;align-items:center;justify-content:center;
    }
    .logo-img-wrap img{
      width:88px;height:88px;
      object-fit:contain;
      filter:drop-shadow(0 6px 20px rgba(249,115,22,.45));
    }
    .logo-fallback{
      display:none;width:88px;height:88px;border-radius:50%;
      background:linear-gradient(135deg,#1e3a5f,#f97316);
      align-items:center;justify-content:center;
      font-size:2.2rem;
    }
    /* wordmark */
    .logo-wordmark-title{
      font-size:2rem;font-weight:900;
      letter-spacing:0.12em;line-height:1;
      background:linear-gradient(135deg,#ffffff 30%,#facc15 80%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      margin-bottom:4px;
    }
    .logo-wordmark-sub{
      font-size:.65rem;font-weight:600;
      letter-spacing:0.28em;text-transform:uppercase;
      color:#475569;line-height:1.5;
    }
    .logo-divider{
      width:32px;height:1.5px;
      background:linear-gradient(90deg,transparent,#f97316,transparent);
      border:none;margin:10px auto 10px;
    }
    .logo-tagline{
      font-size:.7rem;color:#334155;
      font-style:italic;line-height:1.5;
    }

    /* FORM */
    .form-group{margin-bottom:14px;}
    label{
      display:block;font-size:.77rem;
      font-weight:600;color:#94a3b8;margin-bottom:5px;
      text-transform:uppercase;letter-spacing:.05em;
    }
    input{
      width:100%;padding:10px 12px;
      background:#0f2236;border:1px solid #1e3a5f;
      border-radius:8px;font-size:.9rem;
      color:#e2e8f0;font-family:inherit;
      transition:border .2s,box-shadow .2s;
    }
    input::placeholder{color:#334155;}
    input:focus{
      outline:none;
      border-color:#f97316;
      box-shadow:0 0 0 3px rgba(249,115,22,.15);
    }
    .btn-login{
      width:100%;padding:11px;
      background:linear-gradient(135deg,#f97316,#ea6c0a);
      color:#fff;border:none;border-radius:8px;
      font-size:.92rem;font-weight:700;
      cursor:pointer;margin-top:6px;
      transition:opacity .2s,transform .15s;
      display:flex;align-items:center;justify-content:center;gap:8px;
      letter-spacing:.02em;
    }
    .btn-login:hover{opacity:.9;transform:translateY(-1px);}
    .btn-login:active{transform:none;}
    .btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none;}

    /* ALERTS */
    .alert{
      padding:9px 12px;border-radius:8px;
      font-size:.8rem;margin-bottom:12px;display:none;
      border:1px solid;
    }
    .alert-error{background:rgba(220,38,38,.12);color:#fca5a5;border-color:rgba(220,38,38,.25);}
    .alert-info{background:rgba(26,86,219,.12);color:#93c5fd;border-color:rgba(26,86,219,.25);}

    /* SPINNER */
    .spinner{
      display:none;width:16px;height:16px;
      border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* FOOTER */
    .login-footer{
      text-align:center;margin-top:14px;
      font-size:.65rem;color:#1e3a5f;
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="card">
    <div class="logo-area">
      <div class="logo-img-wrap">
        <img
          src="https://pjujogja.id/images/pijar_square.png"
          alt="Logo PIJAR"
          width="88" height="88"
          fetchpriority="high"
          onerror="this.style.display='none';this.parentElement.querySelector('.logo-fallback').style.display='flex'"
        />
        <div class="logo-fallback">⚡</div>
      </div>
      <div class="logo-wordmark-title">PIJAR</div>
      <hr class="logo-divider">
      <div class="logo-wordmark-sub">Penguatan Inventarisasi Jaringan Aset</div>
      <p class="logo-tagline">&ldquo;Urip Kuwi Urup&rdquo; &mdash; UPT PJU Kota Yogyakarta</p>
    </div>

    <div class="alert alert-error" id="alert-error"></div>
    <div class="alert alert-info" id="alert-info"></div>

    <form id="form-login" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="btn-submit">
        <span id="btn-text">Masuk ke PIJAR</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>
  </div>
  <p class="login-footer">&copy; <span id="yr"></span> UPT Penerangan Jalan Umum &middot; Dinas PUPKP Kota Yogyakarta</p>
</div>
<script>
document.getElementById('yr').textContent = new Date().getFullYear();
const API='https://api.pjujogja.id';
if(localStorage.getItem('pijar_token')){
  try{
    const p=JSON.parse(atob(localStorage.getItem('pijar_token').split('.')[1]));
    if(p.exp*1000>Date.now()) window.location.href='index.html';
    else localStorage.removeItem('pijar_token');
  }catch(e){localStorage.removeItem('pijar_token');}
}
async function fetchWithRetry(url,opts,retries=1,delay=1500){
  try{return await fetch(url,opts);}catch(err){
    if(retries>0){
      const i=document.getElementById('alert-info');
      i.textContent='⏳ Server sedang memuat, mencoba kembali...';
      i.style.display='block';
      await new Promise(r=>setTimeout(r,delay));
      i.style.display='none';
      return fetchWithRetry(url,opts,retries-1,delay);
    }throw err;
  }
}
async function doLogin(e){
  e.preventDefault();
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const alertEl=document.getElementById('alert-error');
  const btn=document.getElementById('btn-submit');
  const btnText=document.getElementById('btn-text');
  const spinner=document.getElementById('spinner');
  alertEl.style.display='none';
  btn.disabled=true;btnText.style.display='none';spinner.style.display='block';
  try{
    const res=await fetchWithRetry(`${API}/api/auth/login`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password}),
    });
    const json=await res.json();
    if(json.success){
      localStorage.setItem('pijar_token',json.token);
      localStorage.setItem('pijar_user',JSON.stringify(json.pengguna));
      window.location.href='index.html';
    }else{
      alertEl.textContent=json.error||'Login gagal. Periksa username dan password.';
      alertEl.style.display='block';
    }
  }catch(err){
    alertEl.textContent='Tidak dapat terhubung ke server. Periksa koneksi internet Anda.';
    alertEl.style.display='block';
  }finally{
    btn.disabled=false;btnText.style.display='block';spinner.style.display='none';
  }
}
</script>
</body></html>
