<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemeliharaan — PIJAR</title>
  <script src="js/auth.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;}
    .pijar-main{margin-left:224px;min-height:100vh;}
    .topbar{background:#fff;padding:11px 24px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .topbar h2{font-size:.95rem;font-weight:700;}
    .content{padding:20px 24px;}
    .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
    .toolbar select{padding:7px 11px;border:1px solid #e2e8f0;border-radius:7px;font-size:.82rem;background:#fff;}
    .btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:.82rem;font-weight:600;transition:opacity .15s;}
    .btn-primary{background:#1a56db;color:#fff;}
    .btn-primary:hover{opacity:.88;}
    .btn-sm{padding:4px 10px;font-size:.75rem;}
    .card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;}
    table{width:100%;border-collapse:collapse;font-size:.875rem;}
    thead th{background:#f8fafc;padding:9px 12px;text-align:left;font-weight:700;font-size:.67rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;border-bottom:1px solid #e2e8f0;}
    tbody td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
    tbody tr:hover{background:#f8fafc;}
    .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600;}
    .badge-kuning{background:#fef3c7;color:#92400e;}
    .badge-hijau{background:#d1fae5;color:#065f46;}
    .badge-biru{background:#dbeafe;color:#1e40af;}
    .loading{color:#94a3b8;font-size:.85rem;padding:20px;text-align:center;}
    @media(max-width:768px){.pijar-main{margin-left:0;}}
  </style>
</head>
<body>
<script src="js/sidebar.js" data-page="pemeliharaan"></script>
<div class="pijar-main">
  <div class="topbar"><h2>Pemeliharaan</h2></div>
  <div class="content">
    <div class="toolbar">
      <select id="filter-status" onchange="loadPemeliharaan()"><option value="">Semua Status</option><option>Dijadwalkan</option><option>Berlangsung</option><option>Selesai</option></select>
      <button class="btn btn-primary" onclick="loadPemeliharaan()">Refresh</button>
      <span id="jumlah" style="font-size:.8rem;color:#94a3b8;margin-left:auto"></span>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>#</th><th>Kode Aset</th><th>Jenis Pemeliharaan</th><th>Regu</th><th>Tanggal</th><th>Status</th><th>Catatan</th></tr></thead>
        <tbody id="tbody-pemeliharaan"><tr><td colspan="7" class="loading">🔄 Memuat data...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const API='https://api.pjujogja.id';
const bS={'Dijadwalkan':'badge-biru','Berlangsung':'badge-kuning','Selesai':'badge-hijau'};
async function loadPemeliharaan(){
  const status=document.getElementById('filter-status').value;
  let url=`${API}/api/pemeliharaan?`;
  if(status)url+=`status=${encodeURIComponent(status)}&`;
  const tbody=document.getElementById('tbody-pemeliharaan');
  tbody.innerHTML='<tr><td colspan="7" class="loading">🔄 Memuat...</td></tr>';
  try{
    const res=await fetch(url,{headers:{'Authorization':'Bearer '+localStorage.getItem('pijar_token')}});
    const json=await res.json();const data=json.data||[];
    document.getElementById('jumlah').textContent=`${data.length} record`;
    if(!data.length){tbody.innerHTML='<tr><td colspan="7" class="loading">Belum ada data pemeliharaan.</td></tr>';return;}
    tbody.innerHTML=data.map((p,i)=>`<tr><td style="color:#94a3b8;font-size:.78rem">${i+1}</td><td><code style="font-size:.78rem;color:#1a56db">${p.kode_aset||'-'}</code></td><td style="font-size:.82rem">${p.jenis_pemeliharaan||'-'}</td><td style="font-size:.82rem">${p.nama_regu||'-'}</td><td style="font-size:.78rem;color:#64748b">${p.tanggal?p.tanggal.slice(0,10):'-'}</td><td><span class="badge ${bS[p.status]||'badge-biru'}">${p.status}</span></td><td style="font-size:.8rem;color:#64748b">${p.catatan||'-'}</td></tr>`).join('');
  }catch(e){tbody.innerHTML='<tr><td colspan="7" class="loading">Gagal memuat data.</td></tr>';}
}
loadPemeliharaan();
</script>
</body></html>
