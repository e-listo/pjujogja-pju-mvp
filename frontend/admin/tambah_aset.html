<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Aset — PIJAR</title>
  <script src="js/auth.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;}
    .pijar-main{margin-left:224px;min-height:100vh;}
    .topbar{background:#fff;padding:11px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .topbar a{color:#94a3b8;text-decoration:none;font-size:.82rem;}
    .topbar a:hover{color:#1a56db;}
    .topbar h2{font-size:.95rem;font-weight:700;}
    .content{padding:20px 24px;}
    .form-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:600px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .form-group{margin-bottom:14px;}
    .form-group label{display:block;font-size:.72rem;font-weight:700;margin-bottom:4px;color:#64748b;text-transform:uppercase;letter-spacing:.05em;}
    .form-group input,.form-group select{width:100%;padding:9px 11px;border:1px solid #e2e8f0;border-radius:7px;font-size:.87rem;font-family:inherit;transition:border .2s;}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,.1);}
    .kode-preview{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
    .kode-preview .label{font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
    .kode-preview .kode-val{font-size:1.1rem;font-weight:700;color:#1a56db;font-family:monospace;letter-spacing:.04em;}
    .kode-preview .kode-val.empty{color:#94a3b8;font-weight:400;font-size:.85rem;}
    .btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:.88rem;font-weight:700;transition:opacity .15s;}
    .btn-primary{background:#1a56db;color:#fff;}
    .btn-primary:hover{opacity:.88;}
    .btn-secondary{background:#f1f5f9;color:#374151;border:1px solid #e2e8f0;}
    .wajib{color:#dc2626;}
    @media(max-width:768px){.pijar-main{margin-left:0;}.form-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<script src="js/sidebar.js" data-page="aset"></script>
<div class="pijar-main">
  <div class="topbar">
    <a href="aset.html">← Kembali</a>
    <h2>Tambah Aset PJU Baru</h2>
  </div>
  <div class="content">
    <div class="form-card">

      <!-- Preview Kode Otomatis -->
      <div class="kode-preview">
        <span class="label">Kode Aset</span>
        <span class="kode-val empty" id="kode-preview-val">Pilih kategori &amp; wilayah dulu</span>
      </div>

      <!-- Baris 1: Kategori PJU + Tahun -->
      <div class="form-row">
        <div class="form-group">
          <label>Kategori PJU <span class="wajib">*</span></label>
          <select id="id_kategori" onchange="updateKodePreview()">
            <option value="">— Pilih Kategori —</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tahun Pemasangan <span class="wajib">*</span></label>
          <input type="number" id="tahun_pemasangan" min="2000" max="2099" placeholder="2026" value="2026" oninput="updateKodePreview()">
        </div>
      </div>

      <!-- Baris 2: Wilayah + Status -->
      <div class="form-row">
        <div class="form-group">
          <label>Wilayah (Kelurahan) <span class="wajib">*</span></label>
          <select id="id_wilayah" onchange="updateKodePreview()">
            <option value="">— Pilih Wilayah —</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status_aset">
            <option>Menyala</option>
            <option>Rusak</option>
            <option>Dalam Pengerjaan</option>
          </select>
        </div>
      </div>

      <!-- Alamat -->
      <div class="form-group">
        <label>Alamat <span class="wajib">*</span></label>
        <input type="text" id="alamat" placeholder="Nama jalan / lokasi">
      </div>

      <!-- Koordinat -->
      <div class="form-row">
        <div class="form-group"><label>Latitude <span class="wajib">*</span></label><input type="number" id="lat" step="0.000001" placeholder="-7.800000"></div>
        <div class="form-group"><label>Longitude <span class="wajib">*</span></label><input type="number" id="lng" step="0.000001" placeholder="110.366000"></div>
      </div>

      <!-- Kategori Jalan (legacy enum, tetap dipakai) -->
      <div class="form-row">
        <div class="form-group">
          <label>Kategori Jalan</label>
          <select id="kategori_jalan" onchange="toggleSub()">
            <option>Jalan Kota</option>
            <option>Jalan Lingkungan</option>
            <option>Jalan Lingkungan Kampung</option>
            <option>Lainnya</option>
          </select>
        </div>
        <div class="form-group" id="wrap-sub" style="display:none">
          <label>Sub Kategori</label>
          <select id="sub_kat">
            <option>Taman</option><option>Makam</option>
            <option>Sorot Sungai</option><option>Hias/Budaya</option>
          </select>
        </div>
      </div>

      <!-- Lampu -->
      <div class="form-row">
        <div class="form-group"><label>Jenis Lampu</label><input type="text" id="jenis_lampu" placeholder="LED, HPS, dll"></div>
        <div class="form-group"><label>Daya (Watt)</label><input type="number" id="watt" placeholder="50"></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn btn-secondary" onclick="location.href='aset.html'">Batal</button>
        <button class="btn btn-primary" onclick="submitAset()">Simpan Aset</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://api.pjujogja.id';
let _suggestKode = null; // hasil suggest dari backend: string kode lengkap

// ─── Init ───────────────────────────────────────────────
async function init() {
  const token = localStorage.getItem('pijar_token');
  const h = { 'Authorization': 'Bearer ' + token };

  // Load kategori dari GET /api/kategori-pju
  try {
    const r = await fetch(`${API}/api/kategori-pju`, { headers: h });
    const j = await r.json();
    const sel = document.getElementById('id_kategori');
    (j.data || []).forEach(k => {
      const o = document.createElement('option');
      o.value = k.id;
      o.dataset.kode = k.kode;          // contoh: "PJUP"
      o.textContent = `${k.kode} — ${k.nama}`;
      sel.appendChild(o);
    });
  } catch(e) { console.warn('Gagal load kategori', e); }

  // Load wilayah dari GET /api/wilayah
  // to_dict() mengembalikan: id_wilayah, kode_wilayah, nama_kemantren, nama_kelurahan
  try {
    const r = await fetch(`${API}/api/wilayah`, { headers: h });
    const j = await r.json();
    const sel = document.getElementById('id_wilayah');
    (j.data || []).forEach(w => {
      const o = document.createElement('option');
      o.value = w.id_wilayah;           // PK integer
      o.dataset.kode = w.kode_wilayah;  // contoh: "UH2" — dipakai untuk suggest-kode
      o.textContent = `${w.kode_wilayah} — ${w.nama_kelurahan} (${w.nama_kemantren})`;
      sel.appendChild(o);
    });
  } catch(e) { console.warn('Gagal load wilayah', e); }
}

// ─── Preview Kode ─────────────────────────────────────────
// Memanggil GET /api/aset/suggest-kode?kategori=PJUP&wilayah=UH2&tahun=2026
async function updateKodePreview() {
  const katSel    = document.getElementById('id_kategori');
  const wilSel    = document.getElementById('id_wilayah');
  const tahunVal  = document.getElementById('tahun_pemasangan').value;
  const previewEl = document.getElementById('kode-preview-val');

  const katKode = katSel.options[katSel.selectedIndex]?.dataset.kode;
  const wilKode = wilSel.options[wilSel.selectedIndex]?.dataset.kode;
  const tahun   = parseInt(tahunVal);

  if (!katSel.value || !wilSel.value || !tahun || tahun < 2000) {
    previewEl.textContent = 'Pilih kategori & wilayah dulu';
    previewEl.className = 'kode-val empty';
    _suggestKode = null;
    return;
  }

  previewEl.textContent = 'Menghitung...';
  previewEl.className = 'kode-val empty';

  try {
    const token = localStorage.getItem('pijar_token');
    const url = `${API}/api/aset/suggest-kode?kategori=${encodeURIComponent(katKode)}&wilayah=${encodeURIComponent(wilKode)}&tahun=${tahun}`;
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    const j = await r.json();
    if (j.success && j.suggest) {
      _suggestKode = j.suggest;
      previewEl.textContent = j.suggest;
      previewEl.className = 'kode-val';
    } else {
      previewEl.textContent = j.error || 'Gagal generate kode';
      previewEl.className = 'kode-val empty';
      _suggestKode = null;
    }
  } catch(e) {
    previewEl.textContent = 'Error koneksi';
    previewEl.className = 'kode-val empty';
    _suggestKode = null;
  }
}

// ─── Toggle sub-kategori ────────────────────────────────
function toggleSub() {
  document.getElementById('wrap-sub').style.display =
    document.getElementById('kategori_jalan').value === 'Lainnya' ? 'block' : 'none';
}

// ─── Submit ─────────────────────────────────────────────
async function submitAset() {
  if (!_suggestKode) {
    alert('Lengkapi Kategori, Wilayah, dan Tahun agar kode aset bisa digenerate!'); return;
  }

  const body = {
    id_kategori      : parseInt(document.getElementById('id_kategori').value) || null,
    kode_aset        : _suggestKode,
    tahun_pemasangan : parseInt(document.getElementById('tahun_pemasangan').value) || null,
    id_wilayah       : parseInt(document.getElementById('id_wilayah').value) || null,
    alamat           : document.getElementById('alamat').value.trim(),
    lat              : parseFloat(document.getElementById('lat').value),
    lng              : parseFloat(document.getElementById('lng').value),
    kategori_jalan   : document.getElementById('kategori_jalan').value,
    sub_kategori_lainnya: document.getElementById('kategori_jalan').value === 'Lainnya'
                          ? document.getElementById('sub_kat').value : null,
    jenis_lampu      : document.getElementById('jenis_lampu').value || null,
    watt             : document.getElementById('watt').value ? parseInt(document.getElementById('watt').value) : null,
    status           : document.getElementById('status_aset').value
  };

  if (!body.id_kategori || !body.id_wilayah || !body.alamat || isNaN(body.lat) || isNaN(body.lng)) {
    alert('Lengkapi field wajib: Kategori, Wilayah, Alamat, dan Koordinat!'); return;
  }

  try {
    const res = await fetch(`${API}/api/aset`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('pijar_token')
      },
      body: JSON.stringify(body)
    });
    const json = await res.json();
    if (json.success) {
      alert('Aset berhasil ditambahkan! Kode: ' + _suggestKode);
      location.href = 'aset.html';
    } else {
      alert('Gagal: ' + json.error);
    }
  } catch(e) { alert('Error jaringan.'); }
}

init();
</script>
</body>
</html>
