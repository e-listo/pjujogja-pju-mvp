<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Aset — PIJAR</title>
  <script src="js/auth.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;}
    .pijar-main{margin-left:224px;min-height:100vh;}
    .topbar{background:#fff;padding:11px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .topbar a{color:#94a3b8;text-decoration:none;font-size:.82rem;}
    .topbar a:hover{color:#1a56db;}
    .topbar h2{font-size:.95rem;font-weight:700;}
    .content{padding:20px 24px;}
    .form-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:600px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .form-group{margin-bottom:14px;}
    .form-group label{display:block;font-size:.72rem;font-weight:700;margin-bottom:4px;color:#64748b;text-transform:uppercase;letter-spacing:.05em;}
    .form-group input,.form-group select{width:100%;padding:9px 11px;border:1px solid #e2e8f0;border-radius:7px;font-size:.87rem;font-family:inherit;transition:border .2s;}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:#1a56db;box-shadow:0 0 0 3px rgba(26,86,219,.1);}
    /* Kode aset input + status badge */
    .kode-wrap{position:relative;margin-bottom:14px;}
    .kode-wrap label{display:block;font-size:.72rem;font-weight:700;margin-bottom:4px;color:#64748b;text-transform:uppercase;letter-spacing:.05em;}
    .kode-input-row{display:flex;gap:8px;align-items:center;}
    .kode-input-row input{flex:1;padding:9px 11px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:.97rem;font-family:monospace;font-weight:700;letter-spacing:.04em;transition:border .2s;}
    .kode-input-row input.ok   {border-color:#16a34a;background:#f0fdf4;}
    .kode-input-row input.error{border-color:#dc2626;background:#fef2f2;}
    .kode-input-row input.checking{border-color:#f59e0b;background:#fffbeb;}
    .kode-badge{font-size:.75rem;font-weight:700;white-space:nowrap;padding:4px 10px;border-radius:20px;}
    .kode-badge.ok     {background:#dcfce7;color:#16a34a;}
    .kode-badge.error  {background:#fee2e2;color:#dc2626;}
    .kode-badge.empty  {background:#f1f5f9;color:#94a3b8;}
    .kode-badge.checking{background:#fef9c3;color:#b45309;}
    .kode-hint{font-size:.7rem;color:#64748b;margin-top:3px;}
    .btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:.88rem;font-weight:700;transition:opacity .15s;}
    .btn-primary{background:#1a56db;color:#fff;}
    .btn-primary:hover{opacity:.88;}
    .btn-secondary{background:#f1f5f9;color:#374151;border:1px solid #e2e8f0;}
    .wajib{color:#dc2626;}
    @media(max-width:768px){.pijar-main{margin-left:0;}.form-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<script src="js/sidebar.js" data-page="aset"></script>
<div class="pijar-main">
  <div class="topbar">
    <a href="aset.html">← Kembali</a>
    <h2>Tambah Aset PJU Baru</h2>
  </div>
  <div class="content">
    <div class="form-card">

      <!-- Input Kode Aset (manual + cek availability) -->
      <div class="kode-wrap">
        <label>Kode Aset <span class="wajib">*</span></label>
        <div class="kode-input-row">
          <input type="text" id="kode_aset" placeholder="contoh: PJUP-UH2-26-001"
            oninput="onKodeInput()" autocomplete="off" spellcheck="false">
          <span class="kode-badge empty" id="kode-badge">—</span>
        </div>
        <div class="kode-hint" id="kode-hint">Isi manual atau pilih Kategori + Wilayah untuk saran otomatis</div>
      </div>

      <!-- Baris 1: Kategori PJU + Tahun -->
      <div class="form-row">
        <div class="form-group">
          <label>Kategori PJU <span class="wajib">*</span></label>
          <select id="id_kategori" onchange="updateKodeSuggest()">
            <option value="">— Pilih Kategori —</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tahun Pemasangan <span class="wajib">*</span></label>
          <input type="number" id="tahun_pemasangan" min="2000" max="2099"
            placeholder="2026" value="2026" oninput="updateKodeSuggest()">
        </div>
      </div>

      <!-- Baris 2: Wilayah + Status -->
      <div class="form-row">
        <div class="form-group">
          <label>Wilayah (Kelurahan) <span class="wajib">*</span></label>
          <select id="id_wilayah" onchange="updateKodeSuggest()">
            <option value="">— Pilih Wilayah —</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status_aset">
            <option>Menyala</option><option>Rusak</option><option>Dalam Pengerjaan</option>
          </select>
        </div>
      </div>

      <!-- Alamat -->
      <div class="form-group">
        <label>Alamat <span class="wajib">*</span></label>
        <input type="text" id="alamat" placeholder="Nama jalan / lokasi">
      </div>

      <!-- Koordinat -->
      <div class="form-row">
        <div class="form-group"><label>Latitude <span class="wajib">*</span></label><input type="number" id="lat" step="0.000001" placeholder="-7.800000"></div>
        <div class="form-group"><label>Longitude <span class="wajib">*</span></label><input type="number" id="lng" step="0.000001" placeholder="110.366000"></div>
      </div>

      <!-- Kategori Jalan -->
      <div class="form-row">
        <div class="form-group">
          <label>Kategori Jalan</label>
          <select id="kategori_jalan" onchange="toggleSub()">
            <option>Jalan Kota</option><option>Jalan Lingkungan</option>
            <option>Jalan Lingkungan Kampung</option><option>Lainnya</option>
          </select>
        </div>
        <div class="form-group" id="wrap-sub" style="display:none">
          <label>Sub Kategori</label>
          <select id="sub_kat">
            <option>Taman</option><option>Makam</option>
            <option>Sorot Sungai</option><option>Hias/Budaya</option>
          </select>
        </div>
      </div>

      <!-- Lampu: Jenis + Watt -->
      <div class="form-row">
        <div class="form-group"><label>Jenis Lampu</label><input type="text" id="jenis_lampu" placeholder="LED, HPS, dll"></div>
        <div class="form-group"><label>Daya (Watt)</label><input type="number" id="watt" placeholder="50"></div>
      </div>

      <!-- Lampu: Merk + Tipe -->
      <div class="form-row">
        <div class="form-group"><label>Merk Lampu</label><input type="text" id="merk_lampu" placeholder="Philips, Osram, dll"></div>
        <div class="form-group"><label>Tipe Lampu</label><input type="text" id="tipe_lampu" placeholder="CorePro LED, Master, dll"></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn btn-secondary" onclick="location.href='aset.html'">Batal</button>
        <button class="btn btn-primary" id="btn-simpan" onclick="submitAset()">Simpan Aset</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://api.pjujogja.id';
let _kodeStatus = null; // 'ok' | 'error' | null
let _cekTimeout = null;

// ─── Init ──────────────────────────────────────────────
async function init() {
  const token = localStorage.getItem('pijar_token');
  const h = { 'Authorization': 'Bearer ' + token };

  try {
    const r = await fetch(`${API}/api/kategori-pju`, { headers: h });
    const j = await r.json();
    const sel = document.getElementById('id_kategori');
    (j.data || []).forEach(k => {
      const o = document.createElement('option');
      o.value = k.id; o.dataset.kode = k.kode;
      o.textContent = `${k.kode} — ${k.nama}`;
      sel.appendChild(o);
    });
  } catch(e) { console.warn('Gagal load kategori', e); }

  try {
    const r = await fetch(`${API}/api/wilayah`, { headers: h });
    const j = await r.json();
    const sel = document.getElementById('id_wilayah');
    (j.data || []).forEach(w => {
      const o = document.createElement('option');
      o.value = w.id_wilayah; o.dataset.kode = w.kode_wilayah;
      o.textContent = `${w.kode_wilayah} — ${w.nama_kelurahan} (${w.nama_kemantren})`;
      sel.appendChild(o);
    });
  } catch(e) { console.warn('Gagal load wilayah', e); }
}

// ─── Suggest kode dari kategori+wilayah+tahun ──────────────────
async function updateKodeSuggest() {
  const katSel  = document.getElementById('id_kategori');
  const wilSel  = document.getElementById('id_wilayah');
  const tahun   = parseInt(document.getElementById('tahun_pemasangan').value);
  const katKode = katSel.options[katSel.selectedIndex]?.dataset.kode;
  const wilKode = wilSel.options[wilSel.selectedIndex]?.dataset.kode;

  if (!katSel.value || !wilSel.value || !tahun || tahun < 2000) return;

  try {
    const token = localStorage.getItem('pijar_token');
    const url = `${API}/api/aset/suggest-kode?kategori=${encodeURIComponent(katKode)}&wilayah=${encodeURIComponent(wilKode)}&tahun=${tahun}`;
    const r = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    const j = await r.json();
    if (j.success && j.suggest) {
      const inp = document.getElementById('kode_aset');
      if (!inp.value.trim()) {
        inp.value = j.suggest;
        cekKode(j.suggest);
      }
    }
  } catch(e) { console.warn('Gagal suggest kode', e); }
}

// ─── Cek availability kode (debounce 500ms) ──────────────────
function onKodeInput() {
  clearTimeout(_cekTimeout);
  const val = document.getElementById('kode_aset').value.trim().toUpperCase();
  document.getElementById('kode_aset').value = val;
  if (!val) {
    setBadge('empty', '—', 'Isi manual atau pilih Kategori + Wilayah untuk saran otomatis');
    _kodeStatus = null; return;
  }
  setBadge('checking', 'Mengecek...', '');
  _cekTimeout = setTimeout(() => cekKode(val), 500);
}

async function cekKode(kode) {
  try {
    const token = localStorage.getItem('pijar_token');
    const r = await fetch(
      `${API}/api/aset/cek-kode?kode=${encodeURIComponent(kode)}`,
      { headers: { 'Authorization': 'Bearer ' + token } }
    );
    const j = await r.json();
    if (!j.success) { setBadge('error', 'Error', j.error || ''); _kodeStatus = null; return; }
    if (j.tersedia) {
      setBadge('ok', '✅ Tersedia', 'Kode ini belum dipakai');
      _kodeStatus = 'ok';
    } else if (j.alasan === 'format_invalid') {
      setBadge('error', '❌ Format salah', j.pesan || 'Format tidak valid');
      _kodeStatus = 'error';
    } else {
      setBadge('error', '❌ Sudah dipakai', `Dipakai oleh: ${j.dipakai_oleh || '-'}`);
      _kodeStatus = 'error';
    }
  } catch(e) {
    setBadge('error', 'Error koneksi', ''); _kodeStatus = null;
  }
}

function setBadge(state, text, hint) {
  const badge = document.getElementById('kode-badge');
  const hintEl = document.getElementById('kode-hint');
  badge.className = `kode-badge ${state}`;
  badge.textContent = text;
  if (hint !== undefined) hintEl.textContent = hint;
}

// ─── Toggle sub-kategori ────────────────────────────────────
function toggleSub() {
  document.getElementById('wrap-sub').style.display =
    document.getElementById('kategori_jalan').value === 'Lainnya' ? 'block' : 'none';
}

// ─── Submit ───────────────────────────────────────────────
async function submitAset() {
  const kode = document.getElementById('kode_aset').value.trim();
  if (!kode) { alert('Kode aset wajib diisi!'); return; }
  if (_kodeStatus !== 'ok') { alert('Kode aset tidak valid atau belum dicek ketersediaannya!'); return; }

  const body = {
    id_kategori      : parseInt(document.getElementById('id_kategori').value) || null,
    kode_aset        : kode,
    tahun_pemasangan : parseInt(document.getElementById('tahun_pemasangan').value) || null,
    id_wilayah       : parseInt(document.getElementById('id_wilayah').value) || null,
    alamat           : document.getElementById('alamat').value.trim(),
    lat              : parseFloat(document.getElementById('lat').value),
    lng              : parseFloat(document.getElementById('lng').value),
    kategori_jalan   : document.getElementById('kategori_jalan').value,
    sub_kategori_lainnya: document.getElementById('kategori_jalan').value === 'Lainnya'
                          ? document.getElementById('sub_kat').value : null,
    jenis_lampu      : document.getElementById('jenis_lampu').value || null,
    merk_lampu       : document.getElementById('merk_lampu').value.trim() || null,
    tipe_lampu       : document.getElementById('tipe_lampu').value.trim() || null,
    watt             : document.getElementById('watt').value ? parseInt(document.getElementById('watt').value) : null,
    status           : document.getElementById('status_aset').value
  };

  if (!body.id_kategori || !body.id_wilayah || !body.alamat || isNaN(body.lat) || isNaN(body.lng)) {
    alert('Lengkapi field wajib: Kategori, Wilayah, Alamat, dan Koordinat!'); return;
  }

  try {
    const res = await fetch(`${API}/api/aset`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('pijar_token') },
      body: JSON.stringify(body)
    });
    const json = await res.json();
    if (json.success) {
      alert('Aset berhasil ditambahkan! Kode: ' + kode);
      location.href = 'aset.html';
    } else { alert('Gagal: ' + json.error); }
  } catch(e) { alert('Error jaringan.'); }
}

init();
</script>
</body>
</html>
