<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regu Lapangan — PIJAR</title>
  <script src="js/auth.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;}
    .pijar-main{margin-left:224px;min-height:100vh;}
    .topbar{background:#fff;padding:11px 24px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .topbar h2{font-size:.95rem;font-weight:700;}
    .content{padding:20px 24px;}
    .regu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
    .regu-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px;}
    .regu-header{display:flex;align-items:center;gap:12px;}
    .regu-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#1a56db);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0;}
    .regu-name{font-size:.9rem;font-weight:700;color:#0f172a;}
    .regu-sektor{font-size:.72rem;color:#64748b;margin-top:1px;}
    .regu-stats{display:flex;gap:8px;flex-wrap:wrap;}
    .stat-pill{font-size:.72rem;padding:3px 10px;border-radius:99px;background:#f1f5f9;color:#475569;}
    .loading-grid{color:#94a3b8;font-size:.85rem;padding:20px;text-align:center;grid-column:1/-1;}
    @media(max-width:768px){.pijar-main{margin-left:0;}}
  </style>
</head>
<body>
<script src="js/sidebar.js" data-page="regu"></script>
<div class="pijar-main">
  <div class="topbar"><h2>Regu Lapangan</h2></div>
  <div class="content">
    <div class="regu-grid" id="regu-grid"><p class="loading-grid">🔄 Memuat data regu...</p></div>
  </div>
</div>
<script>
const API='https://api.pjujogja.id';
async function loadRegu(){
  const grid=document.getElementById('regu-grid');
  try{
    const res=await fetch(`${API}/api/regu`,{headers:{'Authorization':'Bearer '+localStorage.getItem('pijar_token')}});
    const json=await res.json();const data=json.data||[];
    if(!data.length){grid.innerHTML='<p class="loading-grid">Belum ada data regu.</p>';return;}
    grid.innerHTML=data.map(r=>`
      <div class="regu-card">
        <div class="regu-header">
          <div class="regu-avatar">${(r.nama_regu||'R').charAt(0)}</div>
          <div>
            <div class="regu-name">${r.nama_regu||'-'}</div>
            <div class="regu-sektor">Sektor ${r.sektor||'-'}</div>
          </div>
        </div>
        <div class="regu-stats">
          <span class="stat-pill">${r.jumlah_anggota||0} anggota</span>
          <span class="stat-pill">${r.jumlah_tugas||0} tugas aktif</span>
        </div>
      </div>`).join('');
  }catch(e){grid.innerHTML='<p class="loading-grid">Gagal memuat data.</p>';}
}
loadRegu();
</script>
</body></html>
