name: Bulk import browser
on:
  push:
    branches: [feature/aset-bulk-import]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-root-only
          MARIADB_DATABASE: pijar_bulk_test
          MARIADB_USER: pijar_ci
          MARIADB_PASSWORD: disposable-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      PIJAR_TEST_DB_URI: mysql+pymysql://pijar_ci:disposable-ci-only@127.0.0.1:3306/pijar_bulk_test
      PIJAR_DISPOSABLE_DB: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Run browser tests in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser/server.py > browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          npx playwright test --config=tests/browser/playwright.config.cjs
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-import-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            browser-server.log
          retention-days: 7
