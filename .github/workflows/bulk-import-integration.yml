name: Bulk import integration

on:
  push:
    branches: [feature/aset-bulk-import]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulk-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-root-only
          MARIADB_DATABASE: pijar_bulk_test
          MARIADB_USER: pijar_ci
          MARIADB_PASSWORD: disposable-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PIJAR_TEST_DB_URI: mysql+pymysql://pijar_ci:disposable-ci-only@127.0.0.1:3306/pijar_bulk_test
      PIJAR_DISPOSABLE_DB: 'yes'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q models.py auth_routes.py aset_bulk_service.py aset_bulk_routes.py tests
      - name: Run validation, MariaDB and HTTP JWT tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_aset_bulk*.py' -v 2>&1 | tee bulk-import-tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-import-tests-${{ github.run_id }}
          path: bulk-import-tests.log
          if-no-files-found: warn
          retention-days: 7
