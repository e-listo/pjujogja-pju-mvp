name: Production schema compatibility
on:
  push:
    branches: [feature/aset-bulk-import, fix/deployment-symlink-preflight]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  production-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.6', '10.11']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: disposable-root-only
          MARIADB_DATABASE: pijar_bulk_test
          MARIADB_USER: pijar_ci
          MARIADB_PASSWORD: disposable-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      PIJAR_TEST_DB_URI: mysql+pymysql://pijar_ci:disposable-ci-only@127.0.0.1:3306/pijar_bulk_test
      PIJAR_DISPOSABLE_DB: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Syntax and isolated deployment preflight tests
        run: |
          python -m compileall -q models.py tests
          bash -n deploy-production.sh
          python -m unittest discover -s tests -p 'test_deployment_preflight.py' -v
      - name: Run suite including persistence against production column constraints
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_aset_bulk*.py' -v 2>&1 | tee production-schema-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-schema-${{ matrix.mariadb }}-${{ github.run_id }}
          path: production-schema-tests.log
          retention-days: 7
